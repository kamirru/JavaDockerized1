apiVersion: v1
kind: Service
metadata:
  name: basicweb
  namespace: basicweb
  labels:
    app.kubernetes.io/name: basicweb
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: java-dockerized1
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: basicweb
    app.kubernetes.io/component: web
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
